<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GATE Prep Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      @keyframes init-spin {
        to { transform: rotate(360deg); }
      }
      #init-loader {
        display: flex; height: 100vh; align-items: center; justify-content: center;
        background-color: #0d1117;
      }
      #init-spinner {
        animation: init-spin 1s linear infinite; width: 36px; height: 36px;
        border: 3px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8; border-radius: 50%;
      }
      @media (prefers-color-scheme: light) {
        #init-loader { background-color: #f8fafc; }
        #init-spinner { border: 3px solid rgba(2, 132, 199, 0.2); border-top-color: #0284c7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="init-loader">
        <div id="init-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
